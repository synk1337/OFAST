[package]
name = "ofast-core"
description = "OFAST core library: reads Counter-Strike 2 files (VPK, KeyValues3, resources) and demos."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Enables extra tests that read the developer's local CS2 install (never available in CI).
# Run with: cargo test --features game-data
game-data = []

[dependencies]
ab_glyph = "0.2"       # TrueType text for weapons' name tags (pure Rust, Apache-2.0) — docs/decisions/002
bcdec_rs = "0.2"       # standard BC1–BC7 block decompression (pure Rust, MIT) — see docs/decisions/002
blake3 = { version = "1", features = ["pure"] } # VPK v2 chunk hashes (pure Rust: no C/asm build step)
crc32fast = "1"        # VPK entry checksums (IEEE CRC-32)
lz4_flex = "0.11"      # KV3 LZ4 buffers and blob chunks (pure Rust)
md-5 = "0.10"          # VPK v2 integrity sections
png = "0.17"           # PNG writing for exported textures (MIT/Apache-2.0)
quick-xml = "0.42"     # HLAE campath files (XML; MIT)
prost = "0.14"         # demo protobuf messages (types generated by build.rs)
rayon = "1"            # parallel texture decoding during exports
ruzstd = "0.8"         # KV3 ZSTD buffers (pure Rust decoder; its encoder is used by tests)
serde = { version = "1", features = ["derive"] } # the demo summary's types serialize for the Studio (apps/studio)
serde_json = "1"       # glTF JSON output
snap = "1"             # demo frames and string-table values are Snappy-compressed (pure Rust)
thiserror = "2"        # error types

[build-dependencies]
prost-build = "0.14"   # generates Rust types from Valve's .proto files (see proto/README.md)
protox = "0.10"        # pure-Rust .proto compiler, so no protoc install is needed

[lints]
workspace = true
