; OFAST sandbox: start on a small level (the engine default is a heavy World Partition map).
[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Engine/Maps/Templates/Template_Default
GameDefaultMap=/Engine/Maps/Templates/Template_Default

; The near clip plane, cm (the engine's default is 10). The first-person viewmodel is drawn shrunk toward the camera
; (import_demo.py, FIRST_PERSON_SCALE) so that it never reaches a wall the player stands against, as CS2's never
; does; shrunk that much, its parts nearest the eye came within 10 cm and were cut away.
[/Script/Engine.Engine]
NearClipPlane=2.0

; Lets OFAST tools send Python commands to a running editor (local machine only).
[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
bRemoteExecution=True

; DirectX 12 + Shader Model 6: required by Nanite. Imported meshes are Nanite; without SM6 Unreal draws their
; simplified fallback meshes instead (thin parts like railings turn into thick blobs).
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

; Lumen global illumination and reflections, virtual shadow maps (UE5 defaults, stated explicitly).
[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
; DBuffer decals (UE5 default, stated explicitly): CS2's translucent overlays are mesh decals, blended into the
; GBuffer before lighting (docs/decisions/009-overlays-as-mesh-decals.md).
r.DBuffer=True
; Auto exposure limits in EV100 (UE5's default for new projects). Used by the "realistic" import style; the
; "standard" style's manual exposure ignores it.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

; Virtual shadow map limits for maps with many shadowed local lights (de_nuke has 174): with the defaults (4096 pages,
; 16 lights per pixel) whole pages of shadow go missing. tools/unreal/import_map.py (RENDER_CVARS) sets them too.
[SystemSettings]
r.Shadow.Virtual.MaxPhysicalPages=16384
r.Shadow.Virtual.OnePassProjection.MaxLightsPerPixel=32
; Motion blur reads the full-resolution image, not a half-resolution second mip that TSR otherwise adds to its output
; whenever motion blur is on. With that mip, Unreal 5.8 stops the editor when a camera is selected ("Assertion failed:
; Texture->Desc.NumMips == 1", RenderGraphValidation.cpp): the camera's preview has motion blur on but skips it on its
; first frame (locking the preview to the camera is a camera cut), so the two-mip image goes on to tone mapping;
; OFAST's CS2 tone curve (import_map.py) replaces the tonemapper with a post-process material, which copies its
; input's layout, mips included (the flashed view after it, grenade_effects.py, copies it again); and the selection
; outline copies that for its depth buffer, which may have only one mip. Motion blur still works; only its long
; streaks, sampled from the half-resolution mip before, now come from the full image (a little noisier on fast flicks).
r.MotionBlur.HalfResInput=0
; Smokes (Heterogeneous Volumes, tools/unreal/smoke_volumes.py) lit by the room around them too, through Lumen's
; translucency volume: without it a smoke in the shade is black (seen in the editor and in shots taken outside
; import_demo.py and the renders, which set it themselves).
r.HeterogeneousVolumes.IndirectLighting=1
r.HeterogeneousVolumes.IndirectLighting.Mode=2
; ... occluded inside the cloud: without it that light filled the smoke evenly, a flat tan blob where CS2's cloud is
; shaded in every crease (2026-10-31).
r.HeterogeneousVolumes.AmbientOcclusion=1
; The realistic look's haze (import_map.py, REALISTIC_FOG) on a finer grid: 8-pixel cells and 128 slices in depth (16
; and 64 by default), so the sun's beams through a roof's slats show as beams, not a blur. CS2's look has no
; volumetric fog: it costs nothing there.
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128
; The realistic look's depth of field blurs the foreground at most 0.3 % of the picture's width (2.5 % by default):
; the viewmodel, drawn a fifth as far from the camera (import_demo.py, FIRST_PERSON_SCALE), blurred into a smear and
; now looks as soft as at its full distance. The background's blur is unchanged.
r.DOF.Kernel.MaxForegroundRadius=0.003
