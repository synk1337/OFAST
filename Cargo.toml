# OFAST Cargo workspace.
#
# Every Rust part of OFAST lives in this one workspace so that `cargo test --workspace` / `cargo clippy --workspace`
# at the repository root checks everything at once. New crates are added to `members` as milestones introduce them
# (apps/capture, the CS2 capture DLL, since M8: Windows-only, it builds empty elsewhere).
#
# A plain `cargo test` / `cargo clippy` checks only the default members, the core and the CLI: they build with
# nothing but Rust installed. The Studio (apps/studio/src-tauri) pulls in Tauri, which needs WebKitGTK on Linux; a
# working Studio is built with npm (`npm run tauri dev` or `npm run tauri build` in apps/studio), which builds its
# web UI first.

[workspace]
resolver = "3"
members = ["crates/ofast-core", "crates/ofast-cli", "apps/studio/src-tauri", "apps/capture"]
default-members = ["crates/ofast-core", "crates/ofast-cli"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/synk1337/OFAST"
authors = ["Synk1337 and the OFAST contributors"]

# Shared lint policy: we document a lot (see docs/development.md), so missing docs are warnings everywhere and
# CI turns warnings into errors.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
